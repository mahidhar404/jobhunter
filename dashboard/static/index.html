<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job Hunter — Command Center</title>
<style>
  :root {
    --bg: #0a0d12; --panel: #10141b; --panel-2: #151a23; --border: #1f2733;
    --text: #d6dce4; --text-dim: #7a8494; --accent: #3ba7ff; --accent-dim: #3ba7ff22;
    --amber: #e2a33d; --amber-dim: #e2a33d1e; --green: #35c98f; --green-dim: #35c98f1e;
    --red: #ef5b5b; --mono: "SF Mono", ui-monospace, "Menlo", monospace;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Inter", system-ui, sans-serif;
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text); font-size: 13px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px; border-bottom: 1px solid var(--border); background: var(--panel);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    margin: 0; color: var(--text-dim);
  }
  header h1 span { color: var(--accent); }
  #stats { display: flex; gap: 18px; }
  .stat { text-align: center; cursor: pointer; padding: 4px 8px; border-radius: 5px; border: 1px solid transparent; }
  .stat:hover { background: var(--panel-2); }
  .stat.stat-active { border-color: var(--accent); background: var(--accent-dim); }
  .stat .n { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  #header-actions { display: flex; gap: 8px; align-items: center; }

  #body { flex: 1; display: flex; min-height: 0; }
  #list-pane { width: 320px; border-right: 1px solid var(--border); flex-shrink: 0; background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #add-job-row { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #add-job-row input { font-size: 11.5px; padding: 6px 8px; }
  #add-job-row button { padding: 6px 10px; flex-shrink: 0; }
  #filter-row { padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #filter-row input { font-size: 11.5px; padding: 6px 8px; margin-bottom: 6px; }
  #filter-row select {
    background: #0006; border: 1px solid var(--border);
    color: var(--text); border-radius: 4px; padding: 5px 6px; font-size: 11px; font-family: inherit;
  }
  #filter-controls { display: flex; gap: 10px; }
  .filter-control-group { flex: 1; min-width: 0; display: flex; align-items: center; gap: 5px; }
  .filter-control-group label { font-size: 9.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; flex-shrink: 0; }
  .filter-control-group select { flex: 1; min-width: 0; }
  #list { flex: 1; overflow-y: auto; min-height: 0; }
  .row { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; position: relative; }
  .row:hover { background: var(--panel-2); }
  .row.active { background: var(--accent-dim); box-shadow: inset 2px 0 0 var(--accent); }
  .row .company { font-weight: 600; font-size: 13px; }
  .row .title { font-size: 11.5px; color: var(--text-dim); margin-top: 1px; }
  .row .meta { font-size: 10.5px; color: var(--text-dim); margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
  .row .meta span:not(:last-child)::after { content: "·"; margin-left: 6px; opacity: 0.6; }
  .row.nested { padding-left: 30px; background: #0002; }
  .row.group-header { background: var(--panel-2); }
  .row.group-header .expand-icon { position: absolute; left: 14px; top: 12px; color: var(--text-dim); font-size: 10px; }
  .row.group-header .company { margin-left: 14px; }
  .row.group-header .count {
    font-size: 10px; font-weight: 500; color: var(--text-dim); text-transform: none;
    margin-left: 6px;
  }
  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle;
  }
  .badge {
    display: inline-block; font-size: 9.5px; font-weight: 600; letter-spacing: 0.03em;
    padding: 2px 7px; border-radius: 3px; margin-top: 6px; text-transform: uppercase;
  }
  #detail { flex: 1; overflow-y: auto; padding: 22px 28px; }
  #console-pane { width: 480px; border-left: 1px solid var(--border); display: flex; flex-direction: column; background: var(--panel); flex-shrink: 0; }
  #console-pane.hidden { display: none; }
  .empty { color: var(--text-dim); padding: 40px 20px; text-align: center; }

  h2 { font-size: 18px; margin: 0 0 2px 0; }
  .subhead { color: var(--text-dim); font-size: 12px; margin-bottom: 10px; }

  .stepper { display: flex; align-items: center; margin: 18px 0 22px 0; }
  .step { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; }
  .step .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--border); border: 2px solid var(--border); z-index: 1; }
  .step.done .dot { background: var(--green); border-color: var(--green); }
  .step.current .dot { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim); }
  .step .lbl { font-size: 9.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; margin-top: 6px; text-align: center; }
  .step.done .lbl, .step.current .lbl { color: var(--text); }
  .step::before { content: ""; position: absolute; top: 5px; left: -50%; width: 100%; height: 1px; background: var(--border); }
  .step:first-child::before { display: none; }
  .step.done::before { background: var(--green); }

  .panel { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; margin-top: 14px; }
  .panel-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 8px; font-weight: 600; }
  .command-box { border-color: var(--amber); background: var(--amber-dim); }
  pre.command { background: #0006; padding: 10px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }

  button, a.btn-link {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 7px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 500;
    text-decoration: none; display: inline-block;
  }
  button:hover, a.btn-link:hover { border-color: var(--accent); text-decoration: none; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06111d; font-weight: 600; }
  button.danger { border-color: var(--red); color: var(--red); }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  textarea, input[type=text] {
    width: 100%; box-sizing: border-box; background: #0006; border: 1px solid var(--border);
    color: var(--text); border-radius: 4px; padding: 8px; font-family: inherit; font-size: 12.5px;
  }

  .qa-log { margin-top: 4px; font-size: 12px; }
  .qa-log .item { padding: 8px 0; border-top: 1px solid var(--border); }
  .qa-log .q { font-weight: 600; }
  .qa-log .a { color: var(--text-dim); margin-top: 2px; }

  .feed { font-family: var(--mono); font-size: 11.5px; max-height: 260px; overflow-y: auto; }
  .feed .ev { padding: 3px 0; display: flex; gap: 8px; border-bottom: 1px solid #ffffff08; }
  .feed .t { color: var(--text-dim); flex-shrink: 0; }
  .feed .k { color: var(--accent); flex-shrink: 0; }
  .feed .d { color: var(--text-dim); }

  #console-log { flex: 1; overflow-y: auto; padding: 12px 16px; font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; }
  #console-input-row { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); }
  #console-input-row input { font-family: var(--mono); }
  .console-cmd { color: var(--accent); }
  .console-out { color: var(--text-dim); margin: 4px 0 10px 0; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  #util-tabs { display: flex; border-bottom: 1px solid var(--border); }
  #util-tabs button { flex: 1; background: none; border: none; border-radius: 0; padding: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); }
  #util-tabs button.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .util-view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .util-view.active { display: flex; }
  .util-scroll { flex: 1; overflow-y: auto; padding: 14px 16px; }
  .kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; font-size: 12px; margin-bottom: 6px; }
  .kv label { color: var(--text-dim); }
  #profile-editor { width: 100%; height: 100%; min-height: 400px; font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1><span>&#9679;</span> Job Hunter — Command Center</h1>
    <div id="stats"></div>
    <div id="header-actions">
      <button id="discover-btn" onclick="runDiscover()">Run discovery</button>
      <button id="cron-btn" onclick="toggleCron()">Cron: …</button>
      <button onclick="openUtil('profile')">Profile</button>
      <button onclick="openUtil('allowlist')">Allowlist</button>
      <button onclick="openUtil('console')">Console</button>
    </div>
  </header>
  <div id="body">
    <div id="list-pane">
      <div id="add-job-row">
        <input id="add-job-url" type="text" placeholder="Paste an apply link…">
        <button class="primary" onclick="addJobByUrl()">Add</button>
      </div>
      <div id="filter-row">
        <input id="filter-input" type="text" placeholder="Filter by company or title…" oninput="render()">
        <select id="source-filter" onchange="render()" style="width:100%;margin-bottom:6px"><option value="">All sources</option></select>
        <div id="filter-controls">
          <div class="filter-control-group">
            <label>Group</label>
            <select id="group-by" onchange="render()">
              <option value="company">Company</option>
              <option value="source">Source</option>
              <option value="none">None</option>
            </select>
          </div>
          <div class="filter-control-group">
            <label>Sort</label>
            <select id="sort-by" onchange="render()">
              <option value="date">Date posted</option>
              <option value="company">Company A–Z</option>
              <option value="status">Status</option>
            </select>
          </div>
        </div>
      </div>
      <div id="list"></div>
    </div>
    <div id="detail"><div class="empty">Select a job to see its live status.</div></div>
    <div id="console-pane" class="hidden">
      <div id="util-tabs">
        <button data-tab="console" onclick="openUtil('console')">Console</button>
        <button data-tab="profile" onclick="openUtil('profile')">Profile</button>
        <button data-tab="allowlist" onclick="openUtil('allowlist')">Allowlist</button>
      </div>

      <div id="view-console" class="util-view">
        <div id="console-log"></div>
        <div id="console-input-row">
          <input id="console-input" type="text" placeholder="e.g. status, models list, sessions --agent job-hunter">
          <button class="primary" onclick="runConsole()">Run</button>
        </div>
      </div>

      <div id="view-profile" class="util-view">
        <div class="util-scroll">
          <div class="panel-title">Applicant profile (learn-as-you-go)</div>
          <textarea id="profile-editor" spellcheck="false"></textarea>
          <div class="btn-row"><button class="primary" onclick="saveProfile()">Save</button><button onclick="loadProfile()">Reload</button></div>
        </div>
      </div>

      <div id="view-allowlist" class="util-view">
        <div class="util-scroll">
          <div class="panel-title">job-hunter exec allowlist</div>
          <div id="allowlist-content"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
