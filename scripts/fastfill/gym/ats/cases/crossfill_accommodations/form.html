<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gym — Accommodations ≠ Consent</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; }
    fieldset { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin-bottom: 1.25rem; }
    legend { font-weight: 600; padding: 0 0.35rem; }
    label { display: block; margin: 6px 0; }
    input[type=radio], input[type=checkbox] { margin-right: 8px; }
    button { margin-top: 1.5rem; padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>EEO &amp; Consent — Cross-fill Guard</h1>
  <p>Applicant: Test Dummy · randommail6969@gmail.com</p>

  <fieldset id="accommodations-field" data-automation-id="formField-accommodations">
    <legend>Do you need accommodations to participate in the interview process?*</legend>
    <label>
      <input type="radio" name="accommodations" value="yes" /> Yes
    </label>
    <label>
      <input type="radio" name="accommodations" value="no" /> No
    </label>
  </fieldset>

  <fieldset id="consent-field" data-automation-id="formField-marketingConsent">
    <legend>Marketing consent — may we email you about future roles?*</legend>
    <label>
      <input type="checkbox" id="marketing-consent" name="marketing_consent" value="yes" />
      I agree to receive marketing emails
    </label>
  </fieldset>

  <button type="button" id="btn-submit">Submit application</button>

  <script>
    document.getElementById('btn-submit').addEventListener('click', function (e) {
      e.preventDefault();
      alert('Gym fixture — submit blocked.');
    });
  </script>
</body>
</html>
