<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gym — Midwizard Sticky Submit</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; }
    label { display: block; margin-bottom: 0.35rem; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .sticky-footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #f5f5f5; border-top: 1px solid #ddd;
      padding: 12px 24px; display: flex; gap: 12px; justify-content: flex-end;
    }
    main { padding-bottom: 80px; }
    .warn { color: #b45309; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Application — Step 2 of 4</h1>
    <p>Applicant: Ada Lovelace · test+gym@example.com</p>
    <p class="warn">Required fields incomplete — footer still shows Submit alongside Next.</p>

    <div class="field">
      <label for="phone">Phone number <span aria-hidden="true">*</span></label>
      <input id="phone" name="phone" type="tel" required value="" placeholder="(555) 010-0200">
    </div>
  </main>

  <div class="sticky-footer" data-footer-kind="ADVANCE">
    <button type="button" id="btn-next">Next</button>
    <button type="button" id="btn-submit">Submit application</button>
  </div>

  <script>
    document.getElementById('btn-next').addEventListener('click', function () {
      var phone = document.getElementById('phone').value.trim();
      if (!phone) {
        alert('Phone is required before advancing.');
        return;
      }
      alert('Gym fixture — would advance (blocked).');
    });
    document.getElementById('btn-submit').addEventListener('click', function (e) {
      e.preventDefault();
      alert('Gym fixture — submit blocked.');
    });
  </script>
</body>
</html>
