<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gym — Workday Education FoS Chip</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; }
    label { display: block; margin-bottom: 0.35rem; font-weight: 600; }
    .field { margin-bottom: 1.25rem; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: #e8f0fe; border: 1px solid #c6dafc; border-radius: 16px;
      padding: 4px 10px; font-size: 14px; margin-bottom: 6px;
    }
    .chip button {
      border: none; background: transparent; cursor: pointer;
      font-size: 16px; line-height: 1; padding: 0 2px; color: #555;
    }
    input[type=text] {
      border: 1px solid #ccc; border-radius: 4px; padding: 8px 12px; width: 100%;
      box-sizing: border-box;
    }
    button.nav { margin-top: 1.5rem; padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>Education — Field of Study (NXP-shaped)</h1>
  <p>Resume autofill committed Science-Computer chip · dummy only</p>

  <div class="field" data-automation-id="formField-fieldOfStudy" id="fos-field">
    <label for="fos-filter">Field of Study*</label>
    <div id="fos-chip-wrap">
      <span class="chip" id="fos-chip" data-automation-id="selectedItem">
        Science-Computer
        <button type="button" aria-label="delete selected" data-automation-id="deleteSelected">×</button>
      </span>
    </div>
    <input id="fos-filter" type="text" name="fieldOfStudy" aria-required="true"
           value="" autocomplete="off" data-automation-id="fieldOfStudy" />
  </div>

  <button class="nav" data-automation-id="bottom-navigation-next-button">Save and Continue</button>

  <script>
    const chipWrap = document.getElementById('fos-chip-wrap');
    const filter = document.getElementById('fos-filter');
    document.getElementById('fos-chip').querySelector('button').addEventListener('click', () => {
      chipWrap.innerHTML = '';
      filter.value = '';
    });
  </script>
</body>
</html>
