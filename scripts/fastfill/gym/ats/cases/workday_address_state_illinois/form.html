<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gym — Workday Address State Illinois</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; }
    .field { margin-bottom: 1.25rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
    [role="listbox"], #state-menu, #hh-menu {
      border: 1px solid #ccc; border-radius: 4px; padding: 8px; margin-top: 4px;
    }
    [data-automation-id="promptOption"], [role="option"] {
      padding: 6px 8px; cursor: pointer; border-radius: 3px;
    }
    [data-automation-id="promptOption"]:hover, [role="option"]:hover { background: #eef; }
    .hint { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>My Information — Workday</h1>
  <p class="hint">
    NXP 2244Z: How-Heard listbox starts open (steals keystrokes). State uses
    promptOption without role=option — Illinois must commit, never Idaho.
  </p>
  <nav aria-label="progress">My Information current · Review</nav>

  <div data-automation-id="contactInformationPage">
    <div class="field" data-automation-id="formField-source" id="hh-wrap">
      <label>How Did You Hear About Us?*</label>
      <div data-automation-id="multiSelectContainer">
        <span id="hh-chip">0 items selected</span>
        <input id="hh-input" data-automation-id="source--source" role="combobox"
               aria-expanded="true" value="" />
      </div>
      <div id="hh-menu" role="listbox" data-automation-id="promptLeafNode">
        <div data-automation-id="promptOption" role="option">Website</div>
        <div data-automation-id="promptOption" role="option">Job Board</div>
        <div data-automation-id="promptOption" role="option">Indeed</div>
      </div>
    </div>

    <div class="field" data-automation-id="formField-countryRegion" id="state-wrap">
      <label for="state-btn">State*</label>
      <button type="button" id="state-btn"
              data-automation-id="addressSection_countryRegion"
              name="countryRegion" aria-haspopup="listbox" aria-expanded="false">
        Select One
      </button>
      <div id="state-menu" style="display:none;" data-automation-id="promptLeafNode">
        <!-- Workday often omits role=option on state rows -->
        <div data-automation-id="promptOption" data-automation-label="Idaho">Idaho</div>
        <div data-automation-id="promptOption" data-automation-label="Illinois">Illinois</div>
        <div data-automation-id="promptOption" data-automation-label="Indiana">Indiana</div>
        <div data-automation-id="promptOption" data-automation-label="Iowa">Iowa</div>
      </div>
    </div>

    <button type="button" data-automation-id="bottom-navigation-next-button">
      Save and Continue
    </button>
  </div>

  <script>
    (function () {
      var btn = document.getElementById("state-btn");
      var menu = document.getElementById("state-menu");
      var hhMenu = document.getElementById("hh-menu");
      var hhInput = document.getElementById("hh-input");

      function closeHH() {
        if (hhMenu) hhMenu.style.display = "none";
        if (hhInput) hhInput.setAttribute("aria-expanded", "false");
      }

      function openState() {
        closeHH();
        menu.style.display = "block";
        btn.setAttribute("aria-expanded", "true");
      }

      function closeState() {
        menu.style.display = "none";
        btn.setAttribute("aria-expanded", "false");
      }

      btn.addEventListener("click", function () {
        if (menu.style.display === "none") openState();
        else closeState();
      });

      menu.querySelectorAll('[data-automation-id="promptOption"]').forEach(function (el) {
        el.addEventListener("click", function () {
          var label = el.getAttribute("data-automation-label") || el.textContent.trim();
          btn.textContent = label;
          closeState();
        });
      });

      // Escape / body click closes how-heard (settle_open_listbox path)
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          closeHH();
          closeState();
        }
      });
      document.body.addEventListener("click", function (e) {
        if (!hhMenu.contains(e.target) && e.target !== hhInput) {
          closeHH();
        }
      });
    })();
  </script>
</body>
</html>
