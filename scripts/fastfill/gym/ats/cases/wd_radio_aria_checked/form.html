<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gym — Workday Radio aria-checked</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; }
    label { display: block; margin: 8px 0; }
    input[type=radio] { width: 16px; height: 16px; vertical-align: middle; }
    .instruction { color: #666; font-size: 0.9rem; margin: 0.5rem 0; }
    button { margin-top: 1.5rem; padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>Previous Employment — Workday</h1>
  <p>Applicant: Test Dummy · randommail6969@gmail.com</p>

  <div data-automation-id="formField-previousWorker" aria-required="true">
    <legend>Have you previously been employed by O&amp;M?*</legend>
    <p class="instruction">CURRENT TEAMMATES: Please apply via your internal career site.</p>
    <label>
      <input type="radio" name="candidateIsPreviousWorker" value="true"
             aria-required="true" /> Yes
    </label>
    <label>
      <input type="radio" name="candidateIsPreviousWorker" value="false"
             aria-required="true" aria-checked="true" /> No
    </label>
  </div>

  <div data-automation-id="formField-source">
    <label>How Did You Hear About Us?*</label>
    <span id="how-heard-display">Corporate Website</span>
  </div>

  <button type="button" id="btn-next">Next</button>

  <script>
    document.getElementById('btn-next').addEventListener('click', function (e) {
      e.preventDefault();
      alert('Gym fixture — advance blocked (no navigation).');
    });
  </script>
</body>
</html>
