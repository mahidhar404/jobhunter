<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gym — Workday Multipage to Review</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; }
    label { display: block; margin-bottom: 0.35rem; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 0.75rem; }
    .step { display: none; }
    .step.active { display: block; }
    .actions { margin-top: 1.5rem; }
    button { padding: 8px 20px; margin-right: 8px; }
    .progress { color: #666; font-size: 0.9rem; margin-bottom: 1rem; }
    .review-summary { background: #f6f8fa; border-radius: 6px; padding: 1rem; margin-top: 1rem; }
    .review-summary dt { font-weight: 600; margin-top: 0.5rem; }
    .review-summary dd { margin: 0.15rem 0 0 0; color: #333; }
  </style>
</head>
<body>
  <h1>Workday Application</h1>
  <p class="progress" id="progress">Step 1 of 4 — My Information</p>

  <div id="step-contact" class="step active" data-step="contact">
    <h2>My Information</h2>
    <label for="first-name">First Name <span aria-hidden="true">*</span></label>
    <input id="first-name" name="firstName" type="text" required placeholder="Legal first name" value="">
    <label for="last-name">Last Name</label>
    <input id="last-name" name="lastName" type="text" placeholder="Legal last name" value="">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="test+gym@example.com" value="">
    <div class="actions">
      <button type="button" id="btn-contact-next" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
    </div>
  </div>

  <div id="step-experience" class="step" data-step="experience">
    <h2>My Experience</h2>
    <label for="job-title">Job Title <span aria-hidden="true">*</span></label>
    <input id="job-title" name="jobTitle" type="text" required placeholder="Most recent role" value="">
    <label for="company">Company</label>
    <input id="company" name="company" type="text" placeholder="Employer name" value="">
    <div class="actions">
      <button type="button" id="btn-exp-back">Back</button>
      <button type="button" id="btn-exp-next" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
    </div>
  </div>

  <div id="step-education" class="step" data-step="education">
    <h2>My Education</h2>
    <label for="school">School or University <span aria-hidden="true">*</span></label>
    <input id="school" name="school" type="text" required placeholder="Institution name" value="">
    <label for="degree">Degree</label>
    <input id="degree" name="degree" type="text" placeholder="Bachelor's" value="">
    <div class="actions">
      <button type="button" id="btn-edu-back">Back</button>
      <button type="button" id="btn-edu-next" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
    </div>
  </div>

  <div id="step-review" class="step" data-step="review">
    <h2>Review</h2>
    <p>Please review your application before submitting.</p>
    <dl class="review-summary" id="review-summary"></dl>
    <div class="actions">
      <button type="button" id="btn-review-back">Back</button>
      <button type="button" id="btn-submit" data-automation-id="bottom-navigation-next-button">Submit</button>
    </div>
  </div>

  <script>
    (function () {
      var steps = ['contact', 'experience', 'education', 'review'];
      var labels = ['My Information', 'My Experience', 'My Education', 'Review'];
      var progress = document.getElementById('progress');
      var idx = 0;

      function showStep(i) {
        idx = i;
        steps.forEach(function (name, j) {
          var el = document.getElementById('step-' + name);
          if (el) el.classList.toggle('active', j === i);
        });
        progress.textContent = 'Step ' + (i + 1) + ' of 4 — ' + labels[i];
        if (i === 3) buildReview();
      }

      function buildReview() {
        var dl = document.getElementById('review-summary');
        dl.innerHTML = '';
        function row(label, val) {
          if (!val) return;
          var dt = document.createElement('dt');
          dt.textContent = label;
          var dd = document.createElement('dd');
          dd.textContent = val;
          dl.appendChild(dt);
          dl.appendChild(dd);
        }
        row('Name', document.getElementById('first-name').value.trim() + ' ' + document.getElementById('last-name').value.trim());
        row('Email', document.getElementById('email').value.trim());
        row('Job Title', document.getElementById('job-title').value.trim());
        row('Company', document.getElementById('company').value.trim());
        row('School', document.getElementById('school').value.trim());
        row('Degree', document.getElementById('degree').value.trim());
      }

      function requireVal(id, msg) {
        var v = document.getElementById(id).value.trim();
        if (!v) { alert(msg); return false; }
        return true;
      }

      document.getElementById('btn-contact-next').addEventListener('click', function () {
        if (!requireVal('first-name', 'First Name is required.')) return;
        showStep(1);
      });
      document.getElementById('btn-exp-back').addEventListener('click', function () { showStep(0); });
      document.getElementById('btn-exp-next').addEventListener('click', function () {
        if (!requireVal('job-title', 'Job Title is required.')) return;
        showStep(2);
      });
      document.getElementById('btn-edu-back').addEventListener('click', function () { showStep(1); });
      document.getElementById('btn-edu-next').addEventListener('click', function () {
        if (!requireVal('school', 'School is required.')) return;
        showStep(3);
      });
      document.getElementById('btn-review-back').addEventListener('click', function () { showStep(2); });
      document.getElementById('btn-submit').addEventListener('click', function (e) {
        e.preventDefault();
        alert('Gym fixture — submit blocked.');
      });
    })();
  </script>
</body>
</html>
